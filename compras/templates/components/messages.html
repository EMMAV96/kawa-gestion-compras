{% if messages %}<div class="messages" aria-label="Notificaciones">{% for m in messages %}<div class="mensaje {{ m.tags|default:'ok' }}" role="{% if 'error' in m.tags %}alert{% else %}status{% endif %}">{% if "error" in m.tags %}{% include "components/icon.html" with icon="close" %}{% else %}{% include "components/icon.html" with icon="check" %}{% endif %}<span>{{ m }}</span></div>{% endfor %}</div>{% endif %}
